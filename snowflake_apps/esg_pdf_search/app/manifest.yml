# For more information on creating manifest, go to https://docs.snowflake.com/en/developer-guide/native-apps/creating-manifest
manifest_version: 1

version:
  name: Dev
  label: "Dev Version"
  comment: "Default version used for development. Override for actual deployment."

artifacts:
  setup_script: setup_script.sql
  readme: README.md
  default_streamlit: core.ui
  extension_code: true  

references:
  - docs_internal_stage:
      description: "Reference to the documents table in the search application."
      object_type: stage
      privileges:
      - read
      register_callback: ui.run
      label: "Documentation Staging Database for Search"
      

